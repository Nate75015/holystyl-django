{% load i18n %}
<script>
  (function () {
    if (typeof Chart === 'undefined') return;
    var dark = document.documentElement.classList.contains('dark');
    function opts() {
      return {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false }, tooltip: { displayColors: false } },
        scales: {
          x: { ticks: { maxTicksLimit: 8, font: { size: 10 }, color: '#94a3b8' }, grid: { display: false } },
          y: { beginAtZero: true, ticks: { maxTicksLimit: 6, font: { size: 10 }, color: '#94a3b8' },
               grid: { color: dark ? 'rgba(255,255,255,0.06)' : 'rgba(15,23,42,0.06)' }, border: { display: false } }
        }
      };
    }
    // Barres à dégradé vertical
    function mkBar(canvas, labels, data, top, bottom) {
      var cx = canvas.getContext('2d');
      var g = cx.createLinearGradient(0, 0, 0, canvas.height || 220);
      g.addColorStop(0, top); g.addColorStop(1, bottom);
      new Chart(canvas, {
        type: 'bar',
        data: { labels: labels, datasets: [{ data: data, backgroundColor: g, borderRadius: 8, maxBarThickness: 42 }] },
        options: opts()
      });
    }
    var mel = document.getElementById('be-monthly'), mc = document.getElementById('chart-monthly');
    if (mel && mc) { var m = JSON.parse(mel.textContent); mkBar(mc, m.labels, m.data, '#3b82f6', 'rgba(59,130,246,0.15)'); }
    var pel = document.getElementById('be-parcelles');
    if (pel) {
      JSON.parse(pel.textContent).forEach(function (pc, i) {
        var c = document.getElementById('chart-parc-' + i);
        if (c) mkBar(c, pc.labels, pc.data, '#0ea5e9', 'rgba(14,165,233,0.15)');
      });
    }
  })();
</script>
