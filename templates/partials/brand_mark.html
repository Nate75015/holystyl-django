{% comment %}Marque Holystyl — goutte d'eau, version noir & blanc.
Param optionnel : size (px, défaut 32), icon (px du SVG).{% endcomment %}
<span class="grid place-items-center rounded-xl" style="height: {{ size|default:32 }}px; width: {{ size|default:32 }}px; background: linear-gradient(160deg, #4b5563, #111827);">
  <svg viewBox="0 0 24 24" width="{{ icon|default:18 }}" height="{{ icon|default:18 }}" fill="none" aria-hidden="true">
    <path d="M12 2.5C12 2.5 5.5 10 5.5 15a6.5 6.5 0 0 0 13 0c0-5-6.5-12.5-6.5-12.5Z" fill="#ffffff"/>
    <path d="M9 14.2a3 3 0 0 0 2.2 2.6" stroke="#9ca3af" stroke-width="1.3" stroke-linecap="round"/>
  </svg>
</span>
