{% load i18n %}
<aside class="glass-panel nav-left sticky top-0 z-30 hidden h-screen w-60 shrink-0 flex-col border-r lg:flex">
  <div class="border-b border-black/10 px-5 pb-4 pt-5 dark:border-white/10">
    <div class="flex items-center gap-2">
      {% include "partials/brand_mark.html" with size=34 icon=20 %}
      <span class="text-lg font-bold tracking-tight">{{ APP_NAME }}</span>
    </div>
    <p class="mt-2 text-xs italic text-slate-500 dark:text-slate-400">{% trans "Remettons du sens dans notre métier" %}</p>
  </div>

  {# Rail : sections cliquables (pilotent le panneau volant via `nav`) #}
  <nav class="flex-1 space-y-1 overflow-y-auto px-3 pb-4">
    {% for section in nav_sections %}
      <button type="button"
              @click="nav = nav === '{{ section.key }}' ? null : '{{ section.key }}'"
              class="sidebar-link flex w-full items-center justify-between"
              :class="nav === '{{ section.key }}' ? 'sidebar-link-active' : ''">
        <span>{{ section.label }}</span>
        <span class="text-slate-400 transition-transform" :class="nav === '{{ section.key }}' ? 'rotate-90' : ''">›</span>
      </button>
    {% endfor %}
  </nav>

</aside>
