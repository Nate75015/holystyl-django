{% load i18n %}
{# Sélecteur de langue — drapeaux des principaux pays agricoles d'Europe #}
{% get_current_language as CUR %}
<div class="relative" x-data="{
       open: false,
       cur: '{{ CUR }}',
       langs: [
         { c: 'fr', flag: 'fr', n: 'Français' },
         { c: 'de', flag: 'de', n: 'Deutsch' },
         { c: 'it', flag: 'it', n: 'Italiano' },
         { c: 'es', flag: 'es', n: 'Español' },
         { c: 'nl', flag: 'nl', n: 'Nederlands' },
         { c: 'pl', flag: 'pl', n: 'Polski' },
         { c: 'ro', flag: 'ro', n: 'Română' },
         { c: 'en', flag: 'gb', n: 'English' },
         { c: 'da', flag: 'dk', n: 'Dansk' },
         { c: 'ga', flag: 'ie', n: 'Gaeilge' },
         { c: 'hu', flag: 'hu', n: 'Magyar' },
         { c: 'el', flag: 'gr', n: 'Ελληνικά' },
       ],
       set(code) {
         document.cookie = 'django_language=' + code + ';path=/;max-age=31536000';
         location.reload();
       }
     }"
     @click.outside="open = false">
  <button type="button" @click="open = !open" title="{% trans 'Langue' %}"
          class="flex h-[28px] items-center gap-1 rounded-[6px] px-2 transition-colors hover:bg-[color:var(--surface-alt)]">
    <span class="fi" style="width:16px;height:11px;border-radius:2px;border:0.5px solid var(--border)" :class="'fi-' + (langs.find(l => l.c === cur) || langs[0]).flag"></span>
    <span class="text-[13px] font-medium uppercase" style="color: var(--text-secondary)" x-text="cur"></span>
    <span class="material-icons-round text-[13px]" style="color: var(--text-muted)">expand_more</span>
  </button>
  <div x-show="open" x-cloak x-transition.opacity
       class="hs-popover absolute right-0 mt-2 w-44 p-1.5" style="color: var(--text)">
    <template x-for="l in langs" :key="l.c">
      <button type="button" @click="set(l.c)"
              class="flex w-full items-center gap-2.5 rounded-md px-3 py-1.5 text-left text-sm hover:bg-[color:var(--surface-alt)]"
              :class="l.c === cur ? 'font-medium' : ''" :style="l.c === cur ? 'color: var(--action)' : ''">
        <span class="fi" style="width:16px;height:11px;border-radius:2px" :class="'fi-' + l.flag"></span>
        <span x-text="l.n"></span>
      </button>
    </template>
  </div>
</div>
