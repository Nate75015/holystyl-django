{% load i18n %}
{% comment %}Bannière d'installation PWA — carte arrondie pleine largeur sous le header.
Apparaît si l'app est installable (beforeinstallprompt / Android) ou iOS.{% endcomment %}
<div x-data="installPrompt()" x-show="visible" x-cloak x-transition
     class="install-bar mx-4 mt-4 flex items-center gap-3 rounded-2xl border px-4 py-3 lg:mx-8">
  <span class="grid h-10 w-10 shrink-0 place-items-center rounded-xl" style="background: var(--action-subtle);">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="var(--action)" stroke-width="1.8" stroke-linecap="round">
      <rect x="7" y="3" width="10" height="18" rx="2.5"/><line x1="11" y1="18.5" x2="13" y2="18.5"/>
    </svg>
  </span>
  <div class="min-w-0 flex-1 leading-tight">
    <p class="font-medium">{% trans "Installer Holystyl" %}</p>
    <p class="text-sm" style="color: var(--text-secondary)" x-text="ios
      ? '{% trans "Partager puis « Sur l’écran d’accueil »." %}'
      : '{% trans "Accédez plus vite depuis votre écran d’accueil." %}'"></p>
  </div>
  <div class="flex shrink-0 items-center gap-2">
    <button x-show="!ios" @click="install()" class="install-btn gap-2 px-4 py-2 text-sm">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14"/>
      </svg>
      {% trans "Télécharger l'app" %}
    </button>
    <button @click="dismiss()" style="color: var(--text-muted)" title="{% trans 'Plus tard' %}">✕</button>
  </div>
</div>

<script>
  function installPrompt() {
    return {
      visible: false, deferred: null, ios: false,
      init() {
        var standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
        if (standalone || localStorage.getItem('holystyl-install') === 'no') return;
        this.ios = /iphone|ipad|ipod/i.test(navigator.userAgent) && !/crios|fxios/i.test(navigator.userAgent);
        if (this.ios) { this.visible = true; return; }
        window.addEventListener('beforeinstallprompt', (e) => {
          e.preventDefault();
          this.deferred = e;
          this.visible = true;
        });
        window.addEventListener('appinstalled', () => { this.visible = false; });
      },
      async install() {
        if (!this.deferred) return;
        this.deferred.prompt();
        await this.deferred.userChoice;
        this.deferred = null; this.visible = false;
      },
      dismiss() { this.visible = false; localStorage.setItem('holystyl-install', 'no'); },
    };
  }
</script>
