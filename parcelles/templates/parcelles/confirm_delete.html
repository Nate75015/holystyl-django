{% extends "base.html" %}
{% load i18n %}

{% block content %}
<section class="mx-auto max-w-md">
  <div class="hs-card p-5 space-y-4">
    <h2 class="text-[15px] font-medium">{% trans "Supprimer la parcelle ?" %}</h2>
    <p class="text-[13px]" style="color: var(--text-secondary)">
      {% blocktrans with name=parcelle.name %}La parcelle « {{ name }} » sera définitivement supprimée.{% endblocktrans %}
    </p>
    <form method="post" class="flex items-center gap-3">
      {% csrf_token %}
      <button type="submit" class="hs-btn-primary" style="background: var(--danger)">{% trans "Supprimer" %}</button>
      <a href="{% url 'parcelles:detail' parcelle.pk %}" class="hs-btn-outline">{% trans "Annuler" %}</a>
    </form>
  </div>
</section>
{% endblock %}
