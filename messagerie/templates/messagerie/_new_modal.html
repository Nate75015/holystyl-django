{% load i18n %}
{# Modal : nouveau message — nécessite x-data="{ modal, tab }" sur un ancêtre #}
<div x-show="modal" x-cloak x-transition.opacity @keydown.escape.window="modal = false"
     class="fixed inset-0 z-40 flex items-start justify-center bg-black/40 p-4 lg:pl-[var(--nav-offset)] sm:items-center">
  <div @click.self="modal = false" class="flex w-full max-w-lg justify-center">
    <div class="hs-popover w-full p-5">
      <div class="mb-4 flex items-center justify-between">
        <h3 class="text-[15px] font-medium">{% trans "Nouveau message" %}</h3>
        <button type="button" @click="modal = false" class="grid h-8 w-8 place-items-center rounded-full hover:bg-black/5 dark:hover:bg-white/10" style="color: var(--text-muted)">✕</button>
      </div>

      <form method="post" action="{% url 'messagerie:new' %}" class="space-y-3">
        {% csrf_token %}
        <input type="hidden" name="mode" :value="tab">

        <div class="grid grid-cols-2 gap-1 rounded-[10px] p-1" style="background: var(--surface-alt)">
          <button type="button" @click="tab = 'direct'"
                  class="flex items-center justify-center gap-1.5 rounded-lg px-3 py-1.5 text-sm font-medium transition"
                  :style="tab === 'direct' ? 'background: var(--surface); color: var(--text)' : 'color: var(--text-secondary)'">
            <span class="material-icons-round text-[16px]">chat_bubble_outline</span>{% trans "Direct" %}
          </button>
          <button type="button" @click="tab = 'groupe'"
                  class="flex items-center justify-center gap-1.5 rounded-lg px-3 py-1.5 text-sm font-medium transition"
                  :style="tab === 'groupe' ? 'background: var(--surface); color: var(--text)' : 'color: var(--text-secondary)'">
            <span class="material-icons-round text-[16px]">groups</span>{% trans "Groupe" %}
          </button>
        </div>

        <div x-show="tab === 'direct'">
          <label for="msg-participant" class="mb-1 block text-sm font-medium">{% trans "À" %} <span style="color: var(--danger)">*</span></label>
          <select id="msg-participant" name="participant" :required="tab === 'direct'" class="dark:[color-scheme:dark]">
            <option value="">{% trans "— Choisir un agriculteur —" %}</option>
            {% for f in farmers %}<option value="{{ f.pk }}">{{ f.full_name|default:f.email }}</option>{% endfor %}
          </select>
        </div>

        <div x-show="tab === 'groupe'" x-cloak class="space-y-3">
          <div>
            <label for="msg-name" class="mb-1 block text-sm font-medium">{% trans "Nom du groupe" %}</label>
            <input id="msg-name" name="name" placeholder="{% trans 'ex: Équipe irrigation' %}">
          </div>
          <div>
            <label for="msg-participants" class="mb-1 block text-sm font-medium">{% trans "Membres" %} <span style="color: var(--danger)">*</span></label>
            <select id="msg-participants" name="participants" multiple size="4" class="dark:[color-scheme:dark]">
              {% for f in farmers %}<option value="{{ f.pk }}">{{ f.full_name|default:f.email }}</option>{% endfor %}
            </select>
            <p class="mt-1 text-xs" style="color: var(--text-muted)">{% trans "Ctrl/Cmd + clic pour en sélectionner plusieurs." %}</p>
          </div>
        </div>

        <div>
          <label for="msg-message" class="mb-1 block text-sm font-medium">{% trans "Message" %} <span style="color: var(--danger)">*</span></label>
          <textarea id="msg-message" name="message" rows="3" required placeholder="{% trans 'Écrivez votre message…' %}"></textarea>
        </div>

        <div class="flex justify-end gap-2 pt-1">
          <button type="button" @click="modal = false" class="hs-btn-outline">{% trans "Annuler" %}</button>
          <button type="submit" class="hs-btn-primary">{% trans "Envoyer" %}</button>
        </div>
      </form>
    </div>
  </div>
</div>
