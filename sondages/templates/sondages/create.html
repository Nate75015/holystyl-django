{% extends "base.html" %}
{% load i18n %}

{% block content %}
<section class="mx-auto max-w-xl space-y-4">
  <h2 class="text-xl font-semibold">{% trans "Nouveau sondage" %}</h2>

  {% if errors %}
    <div class="rounded-xl border border-red-300 bg-red-50 px-4 py-2.5 text-sm text-red-600 dark:border-red-500/40 dark:bg-red-500/10 dark:text-red-400">
      {% for err in errors %}<p>{{ err }}</p>{% endfor %}
    </div>
  {% endif %}

  <form method="post" class="md-card space-y-4">
    {% csrf_token %}
    <div>
      <label class="mb-1 block text-sm font-medium">{% trans "Question" %}</label>
      <input name="question" value="{{ form.question }}" required
             placeholder="{% trans 'Ex. Quelle parcelle irriguer en priorité ?' %}"
             class="w-full rounded-lg border border-slate-200 bg-transparent px-3 py-2 text-sm focus:border-brand focus:outline-none dark:border-white/10">
    </div>

    <div>
      <label class="mb-1 block text-sm font-medium">{% trans "Choix" %}</label>
      <div id="choix-list" class="space-y-2">
        {% for c in form.choix %}
          <input name="choix" value="{{ c }}" placeholder="{% trans 'Choix' %} {{ forloop.counter }}"
                 class="w-full rounded-lg border border-slate-200 bg-transparent px-3 py-2 text-sm focus:border-brand focus:outline-none dark:border-white/10">
        {% endfor %}
      </div>
      <button type="button" onclick="addChoix()" class="mt-2 inline-flex items-center gap-1 text-sm text-brand hover:underline">
        <span class="material-icons-round text-[18px]">add</span>{% trans "Ajouter un choix" %}
      </button>
    </div>

    <div class="flex justify-end gap-2">
      <a href="{% url 'sondages:liste' %}" class="rounded-full px-4 py-2 text-sm hover:bg-black/5 dark:hover:bg-white/5">{% trans "Annuler" %}</a>
      <button type="submit" class="rounded-full bg-brand px-5 py-2 text-sm font-medium text-white transition hover:opacity-90">{% trans "Créer" %}</button>
    </div>
  </form>
</section>

<script>
  function addChoix() {
    var list = document.getElementById('choix-list');
    var input = document.createElement('input');
    input.name = 'choix';
    input.placeholder = '{% trans "Choix" %} ' + (list.children.length + 1);
    input.className = 'w-full rounded-lg border border-slate-200 bg-transparent px-3 py-2 text-sm focus:border-brand focus:outline-none dark:border-white/10';
    list.appendChild(input);
    input.focus();
  }
</script>
{% endblock %}
