# Volume persistant pour la base SQLite (preprod). RWO, storageclass par défaut
# du cluster Kapsule (block storage Scaleway).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: holystyl-data
  namespace: holystyl
spec:
  accessModes: [ReadWriteOnce]
  # Explicite (= défaut du cluster mairie-agglo-prod) pour rester cohérent avec
  # le PVC existant : ce champ est immuable, un apply avec une autre valeur casse.
  storageClassName: sbs-default
  resources:
    requests:
      storage: 2Gi
