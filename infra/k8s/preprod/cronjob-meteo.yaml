# Capture météo planifiée.
# La base SQLite est sur un volume RWO monté par le pod web : on ne remonte pas
# le volume ici. À la place, le CronJob déclenche un endpoint interne (token) et
# c'est le pod web (qui possède la base) qui effectue les écritures.
#
# Cadence horaire : c'est un simple battement, pas la planification. Les créneaux
# sont ancrés côté app sur l'horloge locale (Europe/Paris) — par défaut 06:00 et
# 18:00 — et l'endpoint ne capture qu'une fois par créneau échu. Ce CronJob doit
# donc rester au moins horaire ; l'heure exacte du battement (HH:05) ne fait que
# décaler la capture de quelques minutes après le créneau.
#
# Pré-requis : la clé CRON_TOKEN doit exister dans le secret `holystyl-env`
# (même valeur que le settings CRON_TOKEN de l'app).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: capture-meteo
  namespace: holystyl
spec:
  schedule: "5 * * * *"          # toutes les heures (à HH:05)
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: trigger
              image: curlimages/curl:8.10.1
              env:
                - name: CRON_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: holystyl-env
                      key: CRON_TOKEN
              command: ["sh", "-c"]
              args:
                - >-
                  curl -fsS -X POST
                  -H "X-Cron-Token: $CRON_TOKEN"
                  -H "Host: 51.15.139.157.nip.io"
                  http://web/meteo/cron/capturer/
