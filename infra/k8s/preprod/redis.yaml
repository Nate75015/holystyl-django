# Redis in-cluster pour Channels (WebSocket) + broker Celery.
# Éphémère (emptyDir) — suffisant en preprod ; pas de persistance requise.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: holystyl
spec:
  replicas: 1
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests: { cpu: "25m", memory: "64Mi" }
            limits: { cpu: "250m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: holystyl
spec:
  selector: { app: redis }
  ports:
    - port: 6379
      targetPort: 6379
