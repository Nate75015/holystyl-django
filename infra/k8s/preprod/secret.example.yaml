# Modèle du Secret d'environnement de l'app (NE PAS committer de vraies valeurs).
# Le vrai Secret est créé impérativement (cf. README) avec :
#   - DATABASE_URL : connexion Serverless SQL (user=access_key, pwd=secret_key)
#   - SECRET_KEY   : clé Django générée
#   - ALLOWED_HOSTS / CSRF_TRUSTED_ORIGINS : domaine preprod
apiVersion: v1
kind: Secret
metadata:
  name: holystyl-env
  namespace: holystyl
type: Opaque
stringData:
  DJANGO_ENV: "prod"
  SECRET_KEY: "REMPLACER_PAR_UNE_CLE"
  ALLOWED_HOSTS: "preprod.holystyl.example"
  CSRF_TRUSTED_ORIGINS: "https://preprod.holystyl.example"
  DATABASE_URL: "postgres://ACCESS_KEY:SECRET_KEY@xxxxx.pg.sdb.fr-par.scw.cloud:5432/holystyl?sslmode=require"
  REDIS_URL: "redis://redis:6379/2"
  CELERY_BROKER_URL: "redis://redis:6379/0"
  CELERY_RESULT_BACKEND: "redis://redis:6379/1"
  SECURE_SSL_REDIRECT: "false"
