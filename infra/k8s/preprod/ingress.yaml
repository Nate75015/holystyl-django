# Ingress HTTP(S) — __HOST__ est substitué à l'apply (cf. README).
# TLS Let's Encrypt via cert-manager (annotation cluster-issuer).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  namespace: holystyl
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["__HOST__"]
      secretName: holystyl-tls
  rules:
    - host: __HOST__
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port: { number: 80 }
