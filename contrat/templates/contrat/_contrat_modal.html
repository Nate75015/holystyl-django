{% load i18n %}
<div x-show="modal" x-cloak x-transition.opacity @keydown.escape.window="modal = false"
     class="fixed inset-0 z-40 flex items-start justify-center overflow-y-auto bg-black/40 p-4 lg:pl-[var(--nav-offset)]">
  <div @click.self="modal = false" class="my-auto flex w-full max-w-5xl justify-center">
    <div class="hs-popover w-full p-5">
      <div class="mb-4 flex items-center justify-between">
        <h2 class="text-[16px] font-medium">{% trans "Nouveau contrat" %}</h2>
        <button type="button" @click="modal = false" style="color: var(--text-muted)">✕</button>
      </div>
      <form method="post" action="{% url 'contrat:create' %}" class="space-y-3">
        {% csrf_token %}
        <div>
          <label for="contrat-intitule" class="mb-1 block text-sm" style="color: var(--text-secondary)">{% trans "Intitulé" %} <span style="color: var(--danger)">*</span></label>
          <input id="contrat-intitule" name="intitule" required placeholder="{% trans 'ex: bail parcelle des vergers' %}">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label for="contrat-type" class="mb-1 block text-sm" style="color: var(--text-secondary)">{% trans "Type" %}</label>
            <select id="contrat-type" name="type_contrat">{% for value, label in types %}<option value="{{ value }}">{{ label }}</option>{% endfor %}</select>
          </div>
          <div>
            <label for="contrat-statut" class="mb-1 block text-sm" style="color: var(--text-secondary)">{% trans "Statut" %}</label>
            <select id="contrat-statut" name="statut">{% for value, label in statuts %}<option value="{{ value }}">{{ label }}</option>{% endfor %}</select>
          </div>
        </div>
        <div>
          <label for="contrat-contractant" class="mb-1 block text-sm" style="color: var(--text-secondary)">{% trans "Contractant" %}</label>
          <input id="contrat-contractant" name="contractant" placeholder="{% trans 'nom de la partie contractante' %}">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label for="contrat-date-debut" class="mb-1 block text-sm" style="color: var(--text-secondary)">{% trans "Date de début" %}</label>
            <input id="contrat-date-debut" name="date_debut" type="date">
          </div>
          <div>
            <label for="contrat-date-fin" class="mb-1 block text-sm" style="color: var(--text-secondary)">{% trans "Date de fin" %}</label>
            <input id="contrat-date-fin" name="date_fin" type="date">
          </div>
        </div>
        <div>
          <label for="contrat-montant" class="mb-1 block text-sm" style="color: var(--text-secondary)">{% trans "Montant (€)" %}</label>
          <input id="contrat-montant" name="montant" type="number" step="0.01" min="0" inputmode="decimal" placeholder="0.00">
        </div>
        <div>
          <label for="contrat-notes" class="mb-1 block text-sm" style="color: var(--text-secondary)">{% trans "Notes" %}</label>
          <textarea id="contrat-notes" name="notes" rows="2" placeholder="{% trans 'conditions particulières, échéances…' %}"></textarea>
        </div>
        <div class="flex justify-end gap-2 pt-1">
          <button type="button" @click="modal = false" class="hs-btn-outline">{% trans "Annuler" %}</button>
          <button type="submit" class="hs-btn-primary">{% trans "Enregistrer" %}</button>
        </div>
      </form>
    </div>
  </div>
</div>
