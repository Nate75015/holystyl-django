{% extends "base.html" %}
{% load i18n %}

{% block content %}
<section class="mx-auto max-w-3xl space-y-6">

  <div class="flex items-center gap-3">
    <a href="{% url 'equipe:equipe' %}" title="{% trans 'Retour' %}"
       class="grid h-9 w-9 shrink-0 place-items-center rounded-lg transition hover:bg-black/5 dark:hover:bg-white/10" style="color: var(--text-muted)">
      <span class="material-icons-round text-[20px]">arrow_back</span>
    </a>
    <h1 class="text-[20px]">{% trans "Modifier le membre" %}</h1>
  </div>

  <div class="hs-card p-5">
    <form method="post" class="space-y-5">
      {% csrf_token %}
      {% include "equipe/_member_fields.html" %}

      <div class="flex items-center justify-end gap-2 pt-1">
        <a href="{% url 'equipe:equipe' %}" class="hs-btn-outline">
          {% trans "Annuler" %}
        </a>
        <button type="submit" class="hs-btn-primary">{% trans "Enregistrer" %}</button>
      </div>
    </form>
  </div>
</section>
{% endblock %}
