{% extends "base.html" %}
{% load i18n %}

{% block content %}
<section class="mx-auto max-w-md space-y-6">
  <h2 class="text-xl font-semibold">{% trans "Activer mon compte" %}</h2>
  <div class="md-card">
    <p class="text-sm text-slate-500 dark:text-slate-400">
      {% trans "Saisissez le code d'activation reçu par email après votre paiement (format HOLS-XXXX-XXXX)." %}
    </p>
    <form method="post" class="mt-4 flex gap-2">
      {% csrf_token %}
      <input type="text" name="code" required placeholder="HOLS-XXXX-XXXX" class="flex-1 uppercase">
      <button type="submit" class="md-btn-primary">{% trans "Activer" %}</button>
    </form>
  </div>
</section>
{% endblock %}
