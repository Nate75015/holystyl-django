{% load i18n %}
<div x-show="modal" x-cloak x-transition.opacity @keydown.escape.window="modal = false"
     class="fixed inset-0 z-40 flex items-start justify-center overflow-y-auto bg-black/40 p-4 lg:pl-[var(--nav-offset)]">
  <div @click.self="modal = false" class="my-auto flex w-full max-w-5xl justify-center">
    <div class="hs-popover w-full max-w-2xl p-5">
      <div class="mb-4 flex items-center justify-between">
        <h2 class="text-[16px] font-medium">
          <span x-show="!form.id">{% trans "Nouveau dépôt" %}</span>
          <span x-show="form.id" x-cloak>{% trans "Modifier le dépôt" %}</span>
        </h2>
        <button type="button" @click="modal = false" style="color: var(--text-muted)">✕</button>
      </div>
      <form method="post" action="{% url 'stock:depot_save' %}" class="space-y-3">
        {% csrf_token %}
        <input type="hidden" name="id" :value="form.id || ''">
        <div>
          <label for="depot-nom" class="mb-1 block text-sm" style="color: var(--text-secondary)">{% trans "Nom" %} <span style="color: var(--danger)">*</span></label>
          <input id="depot-nom" name="nom" x-model="form.nom" required placeholder="{% trans 'ex: hangar nord' %}">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label for="depot-type" class="mb-1 block text-sm" style="color: var(--text-secondary)">{% trans "Type" %}</label>
            <select id="depot-type" name="type_depot" x-model="form.type_depot">{% for value, label in types_depot %}<option value="{{ value }}">{{ label }}</option>{% endfor %}</select>
          </div>
          <div>
            <label for="depot-localisation" class="mb-1 block text-sm" style="color: var(--text-secondary)">{% trans "Localisation" %}</label>
            <input id="depot-localisation" name="localisation" x-model="form.localisation" placeholder="{% trans 'lieu-dit, bâtiment…' %}">
          </div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label for="depot-capacite" class="mb-1 block text-sm" style="color: var(--text-secondary)">{% trans "Capacité" %}</label>
            <input id="depot-capacite" name="capacite" type="number" step="0.01" min="0" inputmode="decimal" x-model="form.capacite" placeholder="0">
          </div>
          <div>
            <label for="depot-unite" class="mb-1 block text-sm" style="color: var(--text-secondary)">{% trans "Unité de capacité" %}</label>
            <select id="depot-unite" name="unite_capacite" x-model="form.unite_capacite">
              <option value="">{% trans "Non précisée" %}</option>
              {% for value, label in unites %}<option value="{{ value }}">{{ label }}</option>{% endfor %}
            </select>
          </div>
        </div>
        <div>
          <label for="depot-notes" class="mb-1 block text-sm" style="color: var(--text-secondary)">{% trans "Notes" %}</label>
          <textarea id="depot-notes" name="notes" rows="2" x-model="form.notes" placeholder="{% trans 'accès, conditions de conservation…' %}"></textarea>
        </div>
        <div class="flex justify-end gap-2 pt-1">
          <button type="button" @click="modal = false" class="hs-btn-outline">{% trans "Annuler" %}</button>
          <button type="submit" class="hs-btn-primary">{% trans "Enregistrer" %}</button>
        </div>
      </form>
    </div>
  </div>
</div>
