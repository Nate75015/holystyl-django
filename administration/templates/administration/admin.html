{% extends "base.html" %}
{% load i18n %}

{% block content %}
<section class="mx-auto max-w-2xl space-y-6">
  <h2 class="text-xl font-semibold">{% trans "Administration — Email (SMTP)" %}</h2>
  <form method="post" class="md-card space-y-4">
    {% csrf_token %}
    <div class="grid grid-cols-2 gap-4">
      <div><label class="mb-1 block text-sm font-medium">{% trans "Serveur" %}</label><input type="text" name="host" value="{{ cfg.host|default:'' }}"></div>
      <div><label class="mb-1 block text-sm font-medium">{% trans "Port" %}</label><input type="number" name="port" value="{{ cfg.port|default:587 }}"></div>
    </div>
    <div class="grid grid-cols-2 gap-4">
      <div><label class="mb-1 block text-sm font-medium">{% trans "Utilisateur" %}</label><input type="text" name="user" value="{{ cfg.user|default:'' }}"></div>
      <div><label class="mb-1 block text-sm font-medium">{% trans "Mot de passe" %}</label><input type="password" name="password" value="{{ cfg.password|default:'' }}"></div>
    </div>
    <div class="grid grid-cols-2 gap-4">
      <div><label class="mb-1 block text-sm font-medium">{% trans "Nom expéditeur" %}</label><input type="text" name="from_name" value="{{ cfg.from_name|default:'Holystyl' }}"></div>
      <div><label class="mb-1 block text-sm font-medium">{% trans "Email expéditeur" %}</label><input type="email" name="from_email" value="{{ cfg.from_email|default:'' }}"></div>
    </div>
    <label class="flex items-center gap-2 text-sm"><input type="checkbox" name="secure" {% if cfg.secure %}checked{% endif %} class="h-auto w-auto"> {% trans "SSL (port 465)" %}</label>
    <label class="flex items-center gap-2 text-sm"><input type="checkbox" name="enabled" {% if cfg.enabled or not cfg %}checked{% endif %} class="h-auto w-auto"> {% trans "Activé" %}</label>
    {% if cfg.last_test_status %}
      <p class="text-xs {% if cfg.last_test_status == 'ok' %}text-green-500{% else %}text-red-500{% endif %}">
        {% trans "Dernier test" %} : {{ cfg.last_test_status }} {{ cfg.last_test_error }}
      </p>
    {% endif %}
    <button type="submit" class="md-btn-primary">{% trans "Enregistrer" %}</button>
  </form>
</section>
{% endblock %}
