# Tests de non-régression.
#
# Le contrat d'échange avec Cultiveau est éprouvé ici. `dti/tests.py` vérifie
# que la correspondance déclarée reste applicable : un champ renommé côté
# Isidor y casse immédiatement, plutôt que de se découvrir des mois plus tard
# sur un import silencieusement tronqué.
name: Tests

on:
  push:
    branches: [develop, preprod, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-isidor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  django:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: holystyl
          POSTGRES_PASSWORD: holystyl
          POSTGRES_DB: holystyl
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgres://holystyl:holystyl@localhost:5432/holystyl
      SECRET_KEY: cle-de-test-ci
      IMPORT_DTI_SECRET: secret-de-test-ci

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # requirements.txt tire satkaar-agenda depuis un dépôt privé, en SSH.
      # Un runner GitHub n'a pas de clé : on installe la deploy key read-only
      # d'organisation, la même que celle utilisée par le build d'image
      # (Dockerfile). Un seul accès à faire tourner pour la CI et le déploiement.
      - name: Autoriser le clone du dépôt privé
        env:
          AGENDA_DEPLOY_KEY: ${{ secrets.AGENDA_DEPLOY_KEY }}
        run: |
          if [ -z "$AGENDA_DEPLOY_KEY" ]; then
            echo "::error::Secret AGENDA_DEPLOY_KEY absent — c'est un secret d'organisation satkaar, vérifiez que ce dépôt fait partie des dépôts autorisés."
            exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$AGENDA_DEPLOY_KEY" > ~/.ssh/id_agenda
          chmod 600 ~/.ssh/id_agenda
          ssh-keyscan -t ed25519,rsa github.com >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host github.com\n  IdentityFile ~/.ssh/id_agenda\n  IdentitiesOnly yes\n' >> ~/.ssh/config

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Contrôles Django
        run: python manage.py check

      - name: Migrations à jour
        run: python manage.py makemigrations --check --dry-run

      - name: Contrat d'échange DTI
        # Isolé du reste : c'est la partie qui doit rester verte en toutes
        # circonstances, puisque sa rupture casse l'interopérabilité avec
        # Cultiveau et non seulement une page de l'application.
        run: python -m pytest dti/ -q

      - name: Suite complète
        # Tolérée en échec pour l'instant : six tests étaient déjà rouges
        # (aquaculture, exploitations, planning) avant l'ajout de cette CI.
        # À repasser en bloquant une fois ces échecs traités.
        continue-on-error: true
        run: python -m pytest -q
